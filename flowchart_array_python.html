<script>
function showFC(id) {
  ['fmenu','f1d','f2d','f3d','f4d','ffile'].forEach(t=>document.getElementById(t).style.display='none');
  document.getElementById(id).style.display='block';
  const map={fmenu:'bmenu',f1d:'b1d',f2d:'b2d',f3d:'b3d',f4d:'b4d',ffile:'bfile'};
  ['bmenu','b1d','b2d','b3d','b4d','bfile'].forEach(b=>{
    const el=document.getElementById(b);
    el.style.background='transparent';
    el.style.color='var(--color-text-secondary)';
    el.style.borderColor='var(--color-border-tertiary)';
    el.style.fontWeight='400';
  });
  const a=document.getElementById(map[id]);
  a.style.background='var(--color-background-info)';
  a.style.color='var(--color-text-info)';
  a.style.borderColor='var(--color-border-info)';
  a.style.fontWeight='500';
}
</script>
